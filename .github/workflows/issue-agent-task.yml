name: Issue Agent Task

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  generate-task-pack:
    if: github.event.label.name == 'agent-ready'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Generate ISSUE_AGENT_TASK.md
        uses: ./
        with:
          issue-title: ${{ github.event.issue.title }}
          issue-body: ${{ github.event.issue.body }}
          issue-url: ${{ github.event.issue.html_url }}
          issue-number: ${{ github.event.issue.number }}
          output-path: ISSUE_AGENT_TASK.md
          format: markdown
          profile: codex

      - name: Upload task pack artifact
        uses: actions/upload-artifact@v5
        with:
          name: issue-agent-task-${{ github.event.issue.number }}
          path: ISSUE_AGENT_TASK.md

      - name: Comment with task pack
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body-file ISSUE_AGENT_TASK.md
